<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Card Shadow -->
    <filter id="card-shadow" x="-10" y="-10" width="200" height="180">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#12151C" flood-opacity="0.06" />
    </filter>
    <!-- Top Bar Shadow -->
    <filter id="topbar-shadow" x="0" y="56" width="390" height="10">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#12151C" flood-opacity="0.03" />
    </filter>
  </defs>

  <!-- ================= CANVAS BACKGROUND ================= -->
  <rect x="0" y="0" width="390" height="844" fill="#FAFAF8" />

  <!-- ================= TOP APP BAR ================= -->
  <g id="topbar" filter="url(#topbar-shadow)">
    <!-- Surface Background -->
    <rect x="0" y="0" width="390" height="64" fill="#FFFFFF" />
    <rect x="0" y="63" width="390" height="1" fill="#E4E1D9" />
    
    <!-- Back Button / Hamburger -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="transparent" />
      <text x="16" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#12151C" text-anchor="middle">☰</text>
    </g>

    <!-- Brand Name -->
    <text x="195" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#12151C" text-anchor="middle">TRADESCHOOL</text>

    <!-- User Avatar -->
    <g transform="translate(342, 16)">
      <circle cx="16" cy="16" r="16" fill="#0B1220" />
      <text x="16" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F3F1EA" text-anchor="middle">RR</text>
    </g>
  </g>

  <!-- ================= MAIN CONTENT ================= -->
  <g id="main-content" transform="translate(0, 80)">
    
    <!-- Greeting & Subtitle -->
    <g transform="translate(20, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#12151C">Good morning, RR</text>
      <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4B4F5A">Here are your 4 focus areas today.</text>
    </g>

    <!-- Progress Stats Strip -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#E4E1D9" stroke-width="1" />
      
      <!-- Stat 1 -->
      <g transform="translate(20, 12)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4B4F5A">Total</text>
        <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#12151C">11</text>
      </g>
      <rect x="80" y="12" width="1" height="32" fill="#E4E1D9" />
      
      <!-- Stat 2 -->
      <g transform="translate(100, 12)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4B4F5A">In Progress</text>
        <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#12151C">2</text>
      </g>
      <rect x="180" y="12" width="1" height="32" fill="#E4E1D9" />
      
      <!-- Stat 3 -->
      <g transform="translate(200, 12)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4B4F5A">Completed</text>
        <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#12151C">1</text>
      </g>
    </g>

    <!-- Section Title -->
    <g transform="translate(20, 128)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#12151C">📋 Focus Areas</text>
    </g>

    <!-- ================= 4-ITEM GRID ================= -->
    <g transform="translate(20, 150)">
      
      <!-- Card 1: 01 Market mechanics -->
      <g transform="translate(0, 0)" filter="url(#card-shadow)">
        <rect x="0" y="0" width="165" height="150" rx="12" fill="#FFFFFF" stroke="#E4E1D9" stroke-width="1" />
        
        <!-- Level Pill -->
        <rect x="12" y="12" width="36" height="24" rx="6" fill="#F3E9DB" />
        <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6E4A1E" text-anchor="middle">01</text>
        
        <!-- Title -->
        <text x="12" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#12151C">Market mechanics</text>
        
        <!-- Description -->
        <text x="12" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B4F5A">How does the market</text>
        <text x="12" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B4F5A">physically work?</text>
        
        <!-- Status & Assignee -->
        <rect x="12" y="114" width="50" height="18" rx="4" fill="#F3E9DB" />
        <text x="37" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#6E4A1E" text-anchor="middle">Done</text>
        
        <circle cx="140" cy="125" r="14" fill="#0B1220" />
        <text x="140" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#F3F1EA" text-anchor="middle">RR</text>
      </g>

      <!-- Card 2: 02 Auction behavior -->
      <g transform="translate(185, 0)" filter="url(#card-shadow)">
        <rect x="0" y="0" width="165" height="150" rx="12" fill="#FFFFFF" stroke="#E4E1D9" stroke-width="1" />
        
        <!-- Level Pill -->
        <rect x="12" y="12" width="36" height="24" rx="6" fill="#F3E9DB" />
        <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6E4A1E" text-anchor="middle">02</text>
        
        <!-- Title -->
        <text x="12" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#12151C">Auction behavior</text>
        
        <!-- Description -->
        <text x="12" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B4F5A">Why is price</text>
        <text x="12" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B4F5A">behaving this way?</text>
        
        <!-- Status & Assignee -->
        <rect x="12" y="114" width="75" height="18" rx="4" fill="#9C6B2E" />
        <text x="49" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#F3F1EA" text-anchor="middle">In Progress</text>
        
        <circle cx="140" cy="125" r="14" fill="#9C6B2E" />
        <text x="140" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#F3F1EA" text-anchor="middle">RR</text>
      </g>

      <!-- Card 3: 03 Order flow -->
      <g transform="translate(0, 170)" filter="url(#card-shadow)">
        <rect x="0" y="0" width="165" height="150" rx="12" fill="#FFFFFF" stroke="#E4E1D9" stroke-width="1" />
        
        <!-- Level Pill -->
        <rect x="12" y="12" width="36" height="24" rx="6" fill="#F3E9DB" />
        <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6E4A1E" text-anchor="middle">03</text>
        
        <!-- Title -->
        <text x="12" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#12151C">Order flow</text>
        
        <!-- Description -->
        <text x="12" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B4F5A">What's happening inside</text>
        <text x="12" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B4F5A">the auction right now?</text>
        
        <!-- Status & Assignee -->
        <rect x="12" y="114" width="75" height="18" rx="4" fill="#9C6B2E" />
        <text x="49" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#F3F1EA" text-anchor="middle">In Progress</text>
        
        <circle cx="140" cy="125" r="14" fill="#9C6B2E" />
        <text x="140" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#F3F1EA" text-anchor="middle">RR</text>
      </g>

      <!-- Card 4: 04 Independent research -->
      <g transform="translate(185, 170)" filter="url(#card-shadow)">
        <rect x="0" y="0" width="165" height="150" rx="12" fill="#FFFFFF" stroke="#E4E1D9" stroke-width="1" />
        
        <!-- Level Pill -->
        <rect x="12" y="12" width="36" height="24" rx="6" fill="#F3E9DB" />
        <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6E4A1E" text-anchor="middle">04</text>
        
        <!-- Title -->
        <text x="12" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#12151C">Independent research</text>
        
        <!-- Description -->
        <text x="12" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B4F5A">Can I investigate, challenge,</text>
        <text x="12" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B4F5A">and validate my own ideas?</text>
        
        <!-- Status & Assignee -->
        <rect x="12" y="114" width="50" height="18" rx="4" fill="#E4E1D9" />
        <text x="37" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#8A8D96" text-anchor="middle">To Do</text>
        
        <circle cx="140" cy="125" r="14" fill="#E4E1D9" />
        <text x="140" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#8A8D96" text-anchor="middle">??</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <g id="bottom-nav">
    <!-- Surface Background -->
    <rect x="0" y="780" width="390" height="64" fill="#FFFFFF" />
    <rect x="0" y="780" width="390" height="1" fill="#E4E1D9" />
    
    <!-- Nav Items -->
    <!-- Home (Active) -->
    <g transform="translate(52, 792)">
      <path d="M12 3L3 10v9h6v-6h6v6h6v-9L12 3z" fill="#9C6B2E" transform="scale(0.8) translate(4,4)" />
      <text x="16" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#9C6B2E" text-anchor="middle">Home</text>
    </g>

    <!-- Board -->
    <g transform="translate(160, 792)">
      <rect x="6" y="6" width="8" height="16" rx="1" fill="#8A8D96" />
      <rect x="18" y="6" width="8" height="16" rx="1" fill="#8A8D96" />
      <text x="16" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#8A8D96" text-anchor="middle">Board</text>
    </g>

    <!-- Analytics -->
    <g transform="translate(268, 792)">
      <rect x="8" y="14" width="4" height="8" rx="1" fill="#8A8D96" />
      <rect x="14" y="8" width="4" height="14" rx="1" fill="#8A8D96" />
      <rect x="20" y="4" width="4" height="18" rx="1" fill="#8A8D96" />
      <text x="16" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#8A8D96" text-anchor="middle">Analytics</text>
    </g>

    <!-- Profile -->
    <g transform="translate(350, 792)">
      <circle cx="16" cy="12" r="6" fill="none" stroke="#8A8D96" stroke-width="1.5" />
      <path d="M6 28c0-5.5 5-8 10-8s10 2.5 10 8" fill="none" stroke="#8A8D96" stroke-width="1.5" />
      <text x="16" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#8A8D96" text-anchor="middle">Profile</text>
    </g>
  </g>
</svg>