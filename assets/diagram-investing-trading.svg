<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="auto">
  <defs>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C6B2E" />
      <stop offset="1" stop-color="#6E4A1E" />
    </linearGradient>
  </defs>

  <!-- Eyebrow -->
  <text x="600" y="62" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#9C6B2E" text-anchor="middle">INVESTING OR TRADING</text>

  <!-- Shared time-scale axis -->
  <line x1="90" y1="310" x2="1110" y2="310" stroke="#E4E1D9" stroke-width="2" />
  <line x1="150" y1="310" x2="150" y2="324" stroke="#E4E1D9" stroke-width="2" />
  <line x1="320" y1="310" x2="320" y2="324" stroke="#E4E1D9" stroke-width="2" />
  <line x1="490" y1="310" x2="490" y2="324" stroke="#E4E1D9" stroke-width="2" />
  <line x1="660" y1="310" x2="660" y2="324" stroke="#E4E1D9" stroke-width="2" />
  <line x1="830" y1="310" x2="830" y2="324" stroke="#E4E1D9" stroke-width="2" />
  <line x1="1000" y1="310" x2="1000" y2="324" stroke="#E4E1D9" stroke-width="2" />
  <text x="150" y="352" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#8A8D96" text-anchor="middle">years</text>
  <text x="320" y="352" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#8A8D96" text-anchor="middle">months</text>
  <text x="490" y="352" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#8A8D96" text-anchor="middle">weeks</text>
  <text x="660" y="352" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#8A8D96" text-anchor="middle">days</text>
  <text x="830" y="352" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#8A8D96" text-anchor="middle">hours</text>
  <text x="1000" y="352" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#8A8D96" text-anchor="middle">minutes</text>

  <!-- Investing: long solid arrow -->
  <text x="150" y="130" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="2.5" fill="#8A8D96">INVESTING</text>
  <text x="150" y="166" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#12151C">Holding for years</text>
  <line x1="150" y1="205" x2="940" y2="205" stroke="url(#accent-grad)" stroke-width="6" stroke-linecap="round" />
  <polygon points="940,205 905,187 905,223" fill="#6E4A1E" />
  <text x="945" y="188" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#8A8D96" text-anchor="end">years</text>

  <!-- Trading: short dashed arrow -->
  <text x="150" y="400" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="2.5" fill="#8A8D96">TRADING</text>
  <text x="150" y="436" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#12151C">Days, hours, minutes</text>
  <line x1="150" y1="475" x2="520" y2="475" stroke="#4B4F5A" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 14" />
  <polygon points="520,475 490,458 490,492" fill="#4B4F5A" />

  <!-- Bottom note -->
  <text x="600" y="568" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#8A8D96" text-anchor="middle">neither is more legitimate than the other</text>
</svg>