<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="auto">
  <defs>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C6B2E" />
      <stop offset="1" stop-color="#6E4A1E" />
    </linearGradient>
  </defs>

  <!-- Eyebrow -->
  <text x="600" y="58" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#9C6B2E" text-anchor="middle">FROM BASICS TO LEVEL 11</text>

  <!-- Coordinate guides -->
  <line x1="80" y1="150" x2="1120" y2="150" stroke="#E4E1D9" stroke-width="1" opacity="0.7" />
  <line x1="80" y1="310" x2="1120" y2="310" stroke="#E4E1D9" stroke-width="1" opacity="0.7" />
  <line x1="80" y1="470" x2="1120" y2="470" stroke="#E4E1D9" stroke-width="1" opacity="0.7" />
  <line x1="440" y1="60" x2="440" y2="540" stroke="#E4E1D9" stroke-width="1" opacity="0.7" />
  <line x1="780" y1="60" x2="780" y2="540" stroke="#E4E1D9" stroke-width="1" opacity="0.7" />

  <!-- The ramp -->
  <line x1="160" y1="470" x2="1050" y2="180" stroke="url(#accent-grad)" stroke-width="6" stroke-linecap="round" />

  <!-- Eleven level dots along the ramp -->
  <circle cx="231" cy="447" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="306" cy="422" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="381" cy="398" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="455" cy="374" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="530" cy="349" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="605" cy="325" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="680" cy="300" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="754" cy="276" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="829" cy="252" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="904" cy="228" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />
  <circle cx="979" cy="203" r="6.5" fill="#FFFFFF" stroke="#9C6B2E" stroke-width="2.5" />

  <!-- Start here marker -->
  <circle cx="160" cy="470" r="12" fill="#9C6B2E" />
  <circle cx="160" cy="470" r="5" fill="#FFFFFF" />
  <text x="185" y="526" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#12151C" text-anchor="start">Start here</text>
  <text x="185" y="556" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#4B4F5A" text-anchor="start">the basics on this page</text>

  <!-- Level 1 pickup -->
  <text x="250" y="420" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#12151C" text-anchor="start">Level 1 of the curriculum</text>

  <!-- No gap chip -->
  <rect x="505" y="268" width="200" height="40" rx="20" fill="#F3E9DB" />
  <text x="605" y="293" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#12151C" text-anchor="middle">no gap to jump</text>

  <!-- Level 11 node -->
  <circle cx="1050" cy="180" r="8" fill="#9C6B2E" />
  <text x="1050" y="128" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#8A8D96" text-anchor="end">LEVEL 11</text>
  <text x="1050" y="158" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#12151C" text-anchor="end">independent market research</text>
</svg>