<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display: block; width: 100%; height: auto; max-width: 100%;">
  <defs>
    <!-- Soft Glow for the flagship star -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= 100% TRANSPARENT BACKGROUND ================= -->
  
  <!-- Decorative Dashed Ring (Transparent fill, solid stroke) -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#E4E1D9" stroke-width="2" stroke-dasharray="8,6" />
  
  <!-- Accent Wash Inner Shape (Semi-transparent bronze wash for subtle depth) -->
  <path d="M 250 100 L 380 160 L 380 280 Q 380 380, 250 440 Q 120 380, 120 280 L 120 160 Z" fill="#F3E9DB" opacity="0.4" />

  <!-- ================= CENTRAL SHIELD (QUALITY & PROTECTION) ================= -->
  <!-- The fill is now completely transparent. Only the bronze border remains. -->
  <path d="M 250 80 L 380 160 L 380 280 Q 380 380, 250 440 Q 120 380, 120 280 L 120 160 Z" fill="transparent" stroke="#9C6B2E" stroke-width="4" stroke-linejoin="round" />

  <!-- ================= ISOMETRIC GRADUATION CAP (COURSE & EDUCATION) ================= -->
  <!-- Top Face (Diamond) -->
  <polygon points="250,180 190,220 250,240 310,220" fill="#12151C" />
  <!-- Left Face -->
  <polygon points="190,220 190,240 250,280 250,240" fill="#4B4F5A" />
  <!-- Right Face -->
  <polygon points="310,220 310,240 250,280 250,240" fill="#8A8D96" />
  
  <!-- Tassel (Accent Color) -->
  <line x1="190" y1="240" x2="160" y2="275" stroke="#9C6B2E" stroke-width="4" stroke-linecap="round" />
  <circle cx="160" cy="275" r="5" fill="#9C6B2E" />

  <!-- ================= FLAGSHIP STAR (EXCELLENCE) ================= -->
  <g transform="translate(250, 60)">
    <polygon points="0,-30 10,-5 35,-5 15,10 22,35 0,20 -22,35 -15,10 -35,-5 -10,-5" fill="#9C6B2E" filter="url(#glow)" />
  </g>

  <!-- Decorative Sparkles around the Star -->
  <line x1="250" y1="10" x2="250" y2="22" stroke="#9C6B2E" stroke-width="2" stroke-linecap="round" />
  <line x1="225" y1="18" x2="232" y2="25" stroke="#9C6B2E" stroke-width="2" stroke-linecap="round" />
  <line x1="275" y1="18" x2="268" y2="25" stroke="#9C6B2E" stroke-width="2" stroke-linecap="round" />

  <!-- ================= FLAGSHIP RIBBON (PREMIUM BADGE) ================= -->
  <g transform="translate(380, 160)">
    <!-- Ribbon Fold -->
    <polygon points="0,0 40,-25 40,-5 0,20" fill="#6E4A1E" />
    <!-- Ribbon Face -->
    <polygon points="0,0 40,-25 40,5 0,30" fill="#9C6B2E" />
    <!-- Ribbon Text -->
    <text x="20" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#12151C" text-anchor="middle" letter-spacing="0.5">FLAGSHIP</text>
  </g>
</svg>