<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" fill="none">
  <!-- Minimalist, realistic footprint chart placeholder -->
  <rect width="1200" height="600" fill="#FAFAF8" />
  
  <!-- Grid lines -->
  <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500" stroke="#E4E1D9" stroke-width="1" />
  
  <!-- Example footprint candle 1 -->
  <g transform="translate(200, 200)">
    <!-- Wick -->
    <line x1="40" y1="-50" x2="40" y2="150" stroke="#12151C" stroke-width="2" />
    <!-- Body representation -->
    <rect x="0" y="0" width="80" height="100" fill="#FFFFFF" stroke="#12151C" stroke-width="1.5" />
    <!-- Volume profile histogram inside candle -->
    <rect x="0" y="20" width="30" height="15" fill="#4B4F5A" opacity="0.2" />
    <rect x="0" y="35" width="60" height="15" fill="#4B4F5A" opacity="0.4" />
    <rect x="0" y="50" width="75" height="15" fill="#9C6B2E" opacity="0.6" /> <!-- POC -->
    <rect x="0" y="65" width="40" height="15" fill="#4B4F5A" opacity="0.3" />
  </g>

  <!-- Example footprint candle 2 -->
  <g transform="translate(320, 150)">
    <line x1="40" y1="-20" x2="40" y2="180" stroke="#12151C" stroke-width="2" />
    <rect x="0" y="30" width="80" height="120" fill="#FFFFFF" stroke="#12151C" stroke-width="1.5" />
    <rect x="0" y="50" width="25" height="15" fill="#4B4F5A" opacity="0.2" />
    <rect x="0" y="65" width="80" height="15" fill="#9C6B2E" opacity="0.6" />
    <rect x="0" y="80" width="50" height="15" fill="#4B4F5A" opacity="0.4" />
    <rect x="0" y="95" width="35" height="15" fill="#4B4F5A" opacity="0.3" />
  </g>
  
  <!-- Example footprint candle 3 -->
  <g transform="translate(440, 220)">
    <line x1="40" y1="-60" x2="40" y2="80" stroke="#12151C" stroke-width="2" />
    <rect x="0" y="-10" width="80" height="70" fill="#12151C" stroke="#12151C" stroke-width="1.5" />
    <rect x="40" y="10" width="35" height="15" fill="#9C6B2E" opacity="0.6" />
    <rect x="40" y="25" width="20" height="15" fill="#FAFAF8" opacity="0.4" />
  </g>

  <!-- Annotations using color.ink and color.accent -->
  <path d="M 275,250 C 350,220 400,280 435,230" stroke="#9C6B2E" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <circle cx="435" cy="230" r="4" fill="#9C6B2E" />
  
  <!-- Text Annotation -->
  <rect x="460" y="100" width="220" height="80" fill="#FFFFFF" stroke="#E4E1D9" rx="4" />
  <text x="480" y="130" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#12151C">Absorption at value</text>
  <text x="480" y="155" font-family="'Inter', sans-serif" font-size="12" fill="#4B4F5A">Passive sellers trap initiative</text>
  <text x="480" y="170" font-family="'Inter', sans-serif" font-size="12" fill="#4B4F5A">buying before rotation.</text>
  <path d="M 460,140 L 410,180" stroke="#12151C" stroke-width="1.5" />
</svg>
