<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <rect width="1200" height="540" fill="#F3E9DB"/>
  <!-- 3 person profile cards -->
  <rect x="60" y="60" width="320" height="380" rx="4" fill="#FAFAF8" stroke="#E4E1D9" stroke-width="1"/>
  <rect x="440" y="60" width="320" height="380" rx="4" fill="#FAFAF8" stroke="#E4E1D9" stroke-width="1"/>
  <rect x="820" y="60" width="320" height="380" rx="4" fill="#FAFAF8" stroke="#E4E1D9" stroke-width="1"/>
  <!-- Card 1 -->
  <circle cx="220" cy="170" r="40" fill="#E4E1D9"/>
  <text x="220" y="240" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#9C6B2E" text-anchor="middle">Experienced trader</text>
  <text x="220" y="265" font-family="'Inter', sans-serif" font-size="11" fill="#4B4F5A" text-anchor="middle">Knows the mechanics,</text>
  <text x="220" y="282" font-family="'Inter', sans-serif" font-size="11" fill="#4B4F5A" text-anchor="middle">wants the reasoning</text>
  <!-- Card 2 -->
  <circle cx="600" cy="170" r="40" fill="#E4E1D9"/>
  <text x="600" y="240" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#9C6B2E" text-anchor="middle">HNI / Business owner</text>
  <text x="600" y="265" font-family="'Inter', sans-serif" font-size="11" fill="#4B4F5A" text-anchor="middle">Manages own capital,</text>
  <text x="600" y="282" font-family="'Inter', sans-serif" font-size="11" fill="#4B4F5A" text-anchor="middle">needs structured thinking</text>
  <!-- Card 3 -->
  <circle cx="980" cy="170" r="40" fill="#E4E1D9"/>
  <text x="980" y="240" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#9C6B2E" text-anchor="middle">Serious beginner</text>
  <text x="980" y="265" font-family="'Inter', sans-serif" font-size="11" fill="#4B4F5A" text-anchor="middle">Starting right,</text>
  <text x="980" y="282" font-family="'Inter', sans-serif" font-size="11" fill="#4B4F5A" text-anchor="middle">not starting over</text>
  <text x="600" y="520" font-family="sans-serif" font-size="11" fill="#8A8D96" text-anchor="middle">hero-who.svg — replace with your own image</text>
</svg>
