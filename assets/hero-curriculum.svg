<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%" fill="none">
  <!-- Eleven-level progression diagram, level 1 at bottom to level 11 at top -->
  <style>
    .level-rect { fill: #FFFFFF; stroke: #E4E1D9; stroke-width: 1.5; rx: 4; }
    .level-text-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #8A8D96; font-weight: 500; }
    .level-text-title { font-family: 'Inter', sans-serif; font-size: 14px; fill: #12151C; font-weight: 510; }
    
    .level-rect-accent { fill: #FFFFFF; stroke: #9C6B2E; stroke-width: 2; rx: 4; }
    .level-text-num-accent { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #9C6B2E; font-weight: 500; }
  </style>

  <!-- Level 11 (Top) -->
  <g transform="translate(20, 20)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">11</text>
    <text class="level-text-title" x="48" y="30">Independent market research</text>
  </g>
  <!-- Connector -->
  <line x1="200" y1="70" x2="200" y2="90" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 10 -->
  <g transform="translate(20, 90)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">10</text>
    <text class="level-text-title" x="48" y="30">Professional execution</text>
  </g>
  <line x1="200" y1="140" x2="200" y2="160" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 9 -->
  <g transform="translate(20, 160)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">09</text>
    <text class="level-text-title" x="48" y="30">Institutional decision framework</text>
  </g>
  <line x1="200" y1="210" x2="200" y2="230" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 8 (Capstone / Accent) -->
  <g transform="translate(20, 230)">
    <rect class="level-rect-accent" width="360" height="50" />
    <text class="level-text-num-accent" x="16" y="30">08</text>
    <text class="level-text-title" x="48" y="30">Auction narrative analysis</text>
  </g>
  <line x1="200" y1="280" x2="200" y2="300" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 7 -->
  <g transform="translate(20, 300)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">07</text>
    <text class="level-text-title" x="48" y="30">Multi-timeframe auction intelligence</text>
  </g>
  <line x1="200" y1="350" x2="200" y2="370" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 6 -->
  <g transform="translate(20, 370)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">06</text>
    <text class="level-text-title" x="48" y="30">Macro flow intelligence</text>
  </g>
  <line x1="200" y1="420" x2="200" y2="440" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 5 -->
  <g transform="translate(20, 440)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">05</text>
    <text class="level-text-title" x="48" y="30">Institutional inventory</text>
  </g>
  <line x1="200" y1="490" x2="200" y2="510" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 4 -->
  <g transform="translate(20, 510)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">04</text>
    <text class="level-text-title" x="48" y="30">Market profile and value</text>
  </g>
  <line x1="200" y1="560" x2="200" y2="580" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 3 -->
  <g transform="translate(20, 580)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">03</text>
    <text class="level-text-title" x="48" y="30">Auction market theory</text>
  </g>
  <line x1="200" y1="630" x2="200" y2="650" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 2 -->
  <g transform="translate(20, 650)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">02</text>
    <text class="level-text-title" x="48" y="30">Order flow intelligence</text>
  </g>
  <line x1="200" y1="700" x2="200" y2="720" stroke="#E4E1D9" stroke-width="2" />

  <!-- Level 1 (Bottom) -->
  <g transform="translate(20, 720)">
    <rect class="level-rect" width="360" height="50" />
    <text class="level-text-num" x="16" y="30">01</text>
    <text class="level-text-title" x="48" y="30">Market microstructure</text>
  </g>
</svg>
