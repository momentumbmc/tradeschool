<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:auto">
  <defs>
    <filter id="why-shadow" x="-10" y="-10" width="540" height="660">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#12151C" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1440" height="1024" fill="#FAFAF8"/>
  <!-- Eyebrow -->
  <text x="720" y="96" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" letter-spacing="1.8" fill="#4B4F5A" text-anchor="middle">SIGNAL → AUCTION</text>
  <!-- Left ghost panel -->
  <g transform="translate(120,160)" filter="url(#why-shadow)">
    <rect x="0" y="0" width="520" height="640" rx="16" fill="#F3E9DB" opacity="0.22" stroke="#E4E1D9" stroke-width="1"/>
    <rect x="0" y="0" width="520" height="48" rx="16" fill="#FFFFFF" opacity="1"/>
    <rect x="0" y="40" width="520" height="12" fill="#E4E1D9" opacity="0.35"/>
    <text x="24" y="30" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#4B4F5A">WHAT WE DON’T START WITH</text>
    <!-- Ghost indicator squiggles -->
    <g opacity="0.9" stroke="#8A8D96" stroke-width="1.2" stroke-linecap="round" fill="none">
      <path d="M40 120 C90 96, 140 132, 190 108 C240 84, 300 116, 360 100 C410 86, 450 104, 480 96" stroke-dasharray="3 5" opacity="0.55"/>
      <path d="M40 200 C90 176, 140 212, 190 188 C240 164, 300 196, 360 180 C410 166, 450 184, 480 176" stroke-dasharray="3 5" opacity="0.55"/>
      <path d="M40 280 C90 256, 140 292, 190 268 C240 244, 300 276, 360 260 C410 246, 450 264, 480 256" stroke-dasharray="3 5" opacity="0.55"/>
      <path d="M40 360 C90 336, 140 372, 190 348 C240 324, 300 356, 360 340 C410 326, 450 344, 480 336" stroke-dasharray="3 5" opacity="0.55"/>
    </g>
    <g font-family="Source Sans 3, Inter, system-ui, sans-serif" font-size="12" fill="#4B4F5A">
      <text x="40" y="148">Signals</text>
      <text x="40" y="228">Indicators</text>
      <text x="40" y="308">Patterns</text>
      <text x="40" y="388">Fixed setups</text>
    </g>
    <g font-family="Source Sans 3, Inter, system-ui, sans-serif" font-size="12" fill="#4B4F5A" opacity="1">
      <text x="40" y="520" font-style="italic">No edge without context</text>
    </g>
    <!-- faint overlay X -->
    <g opacity="0.12">
      <line x1="40" y1="80" x2="480" y2="440" stroke="#8A8D96" stroke-width="1"/>
      <line x1="480" y1="80" x2="40" y2="440" stroke="#8A8D96" stroke-width="1"/>
    </g>
  </g>
  <!-- Center arrow -->
  <g transform="translate(720,480)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#E4E1D9" stroke-width="1"/>
    <path d="M-8 0H8M4 -5L9 0L4 5" stroke="#9C6B2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Right sharp panel -->
  <g transform="translate(800,160)" filter="url(#why-shadow)">
    <rect x="0" y="0" width="520" height="640" rx="16" fill="#FFFFFF" stroke="#E4E1D9" stroke-width="1"/>
    <rect x="0" y="0" width="520" height="48" rx="16" fill="#FAFAF8" stroke="#E4E1D9" stroke-width="1"/>
    <rect x="0" y="40" width="520" height="12" fill="#FAFAF8"/>
    <text x="24" y="30" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6E4A1E">WHAT WE TEACH</text>
    <!-- Auction bell curve -->
    <g transform="translate(40,100)">
      <path d="M0 280 L 40 220 L 90 150 L 150 80 L 210 36 L 260 18 L 310 36 L 360 86 L 400 160 L 424 220 L 440 280 Z" fill="#F3E9DB" opacity="0.52" stroke="none"/>
      <path d="M0 280 C 90 210, 150 40, 220 18 C 310 18, 360 140, 440 280" fill="none" stroke="#E4E1D9" stroke-width="1.3"/>
      <!-- Value area -->
      <rect x="150" y="80" width="140" height="110" rx="6" fill="none" stroke="#9C6B2E" stroke-width="1" stroke-dasharray="4 4" opacity="0.9"/>
      <text x="220" y="72" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#6E4A1E" text-anchor="middle">VALUE</text>
      <!-- POC -->
      <line x1="0" y1="108" x2="440" y2="108" stroke="#9C6B2E" stroke-width="1.4" stroke-dasharray="6 4"/>
      <text x="448" y="112" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#6E4A1E">POC</text>
      <!-- VAH / VAL -->
      <line x1="0" y1="62" x2="440" y2="62" stroke="#12151C" stroke-width="0.9" stroke-dasharray="3 4" opacity="0.5"/>
      <text x="448" y="66" font-family="JetBrains Mono, monospace" font-size="9" fill="#12151C">VAH</text>
      <line x1="0" y1="168" x2="440" y2="168" stroke="#12151C" stroke-width="0.9" stroke-dasharray="3 4" opacity="0.5"/>
      <text x="448" y="172" font-family="JetBrains Mono, monospace" font-size="9" fill="#12151C">VAL</text>
      <text x="220" y="250" font-family="JetBrains Mono, monospace" font-size="12" fill="#4B4F5A" text-anchor="middle">time spent at price</text>
    </g>
    <!-- Labels -->
    <g font-family="Source Sans 3, Inter, system-ui, sans-serif" font-size="12" fill="#12151C" font-weight="500">
      <text x="40" y="520">Auction behaviour</text>
      <text x="40" y="542" font-size="12" fill="#4B4F5A" font-weight="400">Participants • Liquidity • Value</text>
    </g>
    <g font-family="Source Sans 3, Inter, system-ui, sans-serif" font-size="11" fill="#6E4A1E">
      <text x="40" y="604" font-weight="600">Inventory → Order flow → Execution</text>
    </g>
  </g>
  <!-- Footnote -->
  <text x="720" y="892" font-family="JetBrains Mono, monospace" font-size="12" fill="#4B4F5A" text-anchor="middle">Left: rules until the market changes character. Right: why the rules worked in the first place.</text>
</svg>
